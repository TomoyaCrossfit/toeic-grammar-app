<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEIC Reading — Part 7</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TOEIC Reading" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="stylesheet" href="reading.css" />
</head>
<body>

  <!-- ===== Nav ===== -->
  <nav class="r-nav">
    <a class="r-nav-back" href="index.html">← HOME</a>
    <div class="r-nav-brand">Part 7 · 長文読解</div>
    <div class="r-nav-links">
      <button class="r-nav-btn active" data-page="select" onclick="showPage('select')">問題選択</button>
      <button class="r-nav-btn" data-page="review" onclick="showPage('review')">弱点復習</button>
      <button class="r-nav-btn" data-page="progress" onclick="showPage('progress')">進捗</button>
      <button class="r-nav-btn" data-page="generate" onclick="showPage('generate')">AI生成</button>
    </div>
  </nav>

  <!-- ===== Page: 問題選択 ===== -->
  <div id="page-select" class="r-page">
    <div class="r-container">
      <div class="r-section-header">
        <div class="r-page-title">Passage を選んで始める</div>
        <div class="r-page-desc">全 4 パッセージ · Part 7 形式</div>
      </div>
      <div class="passage-card-grid" id="passage-card-grid"></div>
    </div>
  </div>

  <!-- ===== Page: Reading ===== -->
  <div id="page-reading" class="r-page hidden">
    <div class="r-container">

      <!-- Reading header -->
      <div class="r-reading-header">
        <button class="r-btn r-btn-outline" onclick="showPage('select')">← 戻る</button>
        <div style="flex:1; min-width:0">
          <div class="r-reading-title" id="reading-title-display"></div>
          <div class="r-page-desc" id="reading-meta-display"></div>
        </div>
        <div class="r-timer-box" id="timer-box">
          <span class="r-timer-label">TIME</span>
          <span class="r-timer-value" id="timer-display">00:00</span>
        </div>
        <div class="r-score-box">
          <span class="r-score-label">SCORE</span>
          <span class="r-score-value" id="score-display">— / —</span>
        </div>
      </div>

      <!-- Result Banner -->
      <div id="result-banner" class="r-result-banner hidden"></div>

      <!-- 2-column grid -->
      <div class="r-main-grid">
        <div class="r-passage-panel">
          <div class="r-panel-label">Passage <span class="r-panel-line"></span></div>
          <div class="r-passage-meta" id="passage-meta"></div>
          <div class="r-passage-title" id="passage-title"></div>
          <div class="r-passage-body" id="passage-body"></div>
        </div>
        <div>
          <div class="r-panel-label">Questions <span class="r-panel-line"></span></div>
          <div id="questions-list"></div>
        </div>
      </div>

      <!-- Footer actions -->
      <div class="r-footer">
        <button class="r-btn r-btn-outline" onclick="showPage('select')">← 問題選択に戻る</button>
        <button class="r-btn r-btn-outline hidden" id="retry-btn" onclick="retryPassage()">もう一度解く</button>
        <button class="r-btn r-btn-solid" id="submit-btn" onclick="submitAnswers()" disabled>Submit Answers</button>
      </div>

    </div>
  </div>

  <!-- ===== Page: 弱点復習 ===== -->
  <div id="page-review" class="r-page hidden">
    <div class="r-container">
      <div class="r-section-header">
        <div class="r-page-title">弱点復習</div>
        <div class="r-page-desc">最後の挑戦で間違えた問題 · 再挑戦して正確さを上げよう</div>
      </div>
      <div id="review-list"></div>
    </div>
  </div>

  <!-- ===== Page: 進捗 ===== -->
  <div id="page-progress" class="r-page hidden">
    <div class="r-container">
      <div class="r-section-header">
        <div class="r-page-title">学習進捗</div>
        <div class="r-page-desc">PART 7 READING PROGRESS</div>
      </div>
      <div class="prog-overview" id="prog-overview"></div>
      <div class="r-section-header" style="margin-top:8px">
        <div class="r-page-title" style="font-size:1.1rem">パッセージ別成績</div>
      </div>
      <div id="prog-rows"></div>
      <div style="margin-top:28px">
        <button class="r-btn r-btn-danger" onclick="resetProgress()">進捗をリセット</button>
      </div>
    </div>
  </div>

  <!-- ===== Page: AI生成 ===== -->
  <div id="page-generate" class="r-page hidden">
    <div class="r-container">
      <div class="r-section-header">
        <div class="r-page-title">AI 問題生成</div>
        <div class="r-page-desc">Anthropic API · Part 7 パッセージを自動生成</div>
      </div>

      <!-- API Key -->
      <div class="gen-card">
        <label class="gen-label" for="gen-api-key">Anthropic API キー</label>
        <input type="password" id="gen-api-key" class="gen-input" placeholder="sk-ant-..." />
        <div class="gen-hint">キーはこのブラウザのローカルストレージにのみ保存されます</div>
      </div>

      <!-- Options -->
      <div class="gen-card">
        <div class="gen-options">
          <div>
            <label class="gen-label">文書タイプ</label>
            <select id="gen-type" class="gen-select">
              <option value="Memo">Memo（社内メモ）</option>
              <option value="Business Email">Business Email（メール）</option>
              <option value="Article">Article（記事）</option>
              <option value="Form / Survey">Form（フォーム）</option>
              <option value="Notice">Notice（お知らせ）</option>
              <option value="Advertisement">Advertisement（広告）</option>
            </select>
          </div>
          <div>
            <label class="gen-label">難易度</label>
            <select id="gen-difficulty" class="gen-select">
              <option value="easy">Easy（基礎）</option>
              <option value="medium" selected>Medium（標準）</option>
              <option value="hard">Hard（上級）</option>
            </select>
          </div>
          <div>
            <label class="gen-label">問題数</label>
            <select id="gen-qcount" class="gen-select">
              <option value="2">2問</option>
              <option value="3" selected>3問</option>
              <option value="4">4問</option>
            </select>
          </div>
        </div>
        <button id="gen-btn" class="r-btn r-btn-solid" onclick="generatePassage()">AI でパッセージを生成する</button>
        <div id="gen-status" class="gen-status"></div>
      </div>

      <!-- Generated list -->
      <div class="r-section-header" style="margin-top:8px">
        <div class="r-page-title" style="font-size:1.1rem">生成済みパッセージ</div>
      </div>
      <div id="generated-list"></div>
    </div>
  </div>

  <script src="reading-data.js"></script>
  <script src="reading.js"></script>
</body>
</html>
